; SPDX-License-Identifier: MIT
;
; FG23 SDR — ESP32-S3 oldal
;   Copyright (c) 2026 Zoltan Doczi HA7DCD
;
; ================== MIERT EGY PROJEKT, TOBB ENVIRONMENT ==================
;
; A benchmarknak MAS build_flags kell (ARDUINO_USB_MODE 1 <-> 0), es mas a
; belepesi pontja. Ettol meg nem kell kulon projekt: a PlatformIO pont erre
; valo. Egy repo, egy platformio.ini, tobb legordulo bejegyzes a VSCode
; statuszsavjaban.
;
; Kulon projektben az lenne a baj, hogy a blokk-formatum (1040 bajt, "IQB2",
; a fejlec mezoi) KET helyen elne. Ket helyen elo igazsagbol elobb-utobb ket
; KULONBOZO igazsag lesz — pontosan ez okozta a tegnapi ejszakai hajszat, ahol
; egy elavult sketch-fejlec EXP-terkepe egy pozicioval el volt csuszva.
;
; UGYANEZ AZ ELV MOST A FIRMWARE-ENVIRONMENTEKRE IS: harom valtozat kell
; belole (TinyUSB / HWCDC / WiFi-mentes), de a build_src_filter, a lib_deps es
; a particio-sema MIND A HAROMBAN ugyanaz. Ha harom helyre irnam ki, az harom
; helyen elo igazsag lenne. Ezert van a [fw_base] sablon es az "extends":
; a kozos resz EGY helyen van, az environmentek CSAK a kulonbseget mondjak ki.
;
; ================== MAPPASZERKEZET ==================
;
;   fg23-sdr/
;     platformio.ini        <- ez a fajl
;     src/
;       main.cpp            <- a fo firmware (SPI slave -> USB + WiFi + rtl_tcp)
;     bench/
;       usb_bench.cpp       <- az USB-plafon mero (nevezd at .ino-rol .cpp-re)
;       cs_probe.cpp        <- CS-lab proba
;
; A PC-oldali mero scriptek NEM itt vannak, hanem a meromappaban:
;   G:\Sajat meghajto\Python_Measurements\WSPR\RF_measurements\
;     usb_aprs_rx.py        <- natív USB -> PC-oldali APRS-dekoder + SPI-lyuk
;     rtl_aprs_rx.py        <- fuggetlen RTL-SDR tanu (ugyanaz a demod-mag)
;     aprs_per.py           <- PER/erzekenyseg meres az ESP soros kimenetebol
;
; A bench/ AZERT nem a src/ alatt van, mert a PlatformIO alapbol MINDENT
; leforditana a src/-bol, es akkor ket setup()/loop() utkozne.
;
; A Simplicity Studio projekt (app.c, iq_stream.c, cmdlink.c) kulon el —
; az mas toolchain, annak itt nincs helye.
;
; ================== AZ USB-FLAGEKROL — EZ A LENYEG ==================
;
; MINDEN environment KIMONDVA allitja be az ARDUINO_USB_MODE-ot es az
; ARDUINO_USB_CDC_ON_BOOT-ot. Nem bizzuk a board-definiciora.
;
; MIERT: 2026-08-01-en a fo environmentbol kihagytam oket, arra szamitva, hogy
; az esp32-s3-devkitc-1 board maga adja. A pioarduino 55.x-nel NEM adja —
; emiatt a Serial nem a nativ USB CDC lett, hanem a UART0, es a forditas
; elszallt:
;     error: 'class HardwareSerial' has no member named 'setTxTimeoutMs'
;     error: no matching function for call to 'HardwareSerial::begin()'
;
; A hibauzenet felrevezeto: nem a setTxTimeoutMs hianyzik, hanem a Serial
; TIPUSA lett mas. CDC_ON_BOOT=1 mellett Serial = HWCDC (vagy USBCDC), es
; annak van setTxTimeoutMs-e. Ezert nem szabad felteveseket epiteni arra,
; mit ad a board — ird ki.
;
; A build_unflags-ROL, ES EGY CSAPDAROL: a PlatformIO a build_unflags-et a
; build_flags UTAN dolgozza fel, a VEGSO flag-halmazon. Tehat ha ugyanazt a
; makrot unflagelnem is es flagelnem is, a sajat flagemet torolnem ki. Pont ez
; tortent 2026-08-01-en: a kozos blokkban ott volt a
; "-DARDUINO_USB_CDC_ON_BOOT=1" unflagkent, es kinyirta az environmentben
; beallitott ugyanolyan flaget — maradt a 0, es ugyanaz a forditasi hiba jott
; vissza masodszor is.
;
; EZERT: minden environment CSAK AZ ELLENKEZO erteket unflageli. Amit be akar
; allitani, azt nem. Ha a board ugyanazt az erteket adja, az azonos
; ujradefinialas — a C ezt megengedi, figyelmeztetes sincs.
;
; ================== 2026-08-06: A FO FIRMWARE ATALLT MODE=0-RA ==================
;
; A fo firmware eddig MODE=1 volt (HWCDC = a beepitett USB-Serial/JTAG). Ez a
; SUGARZASI meresekhez hasznalhatatlan, ket egyutt hato tulajdonsag miatt:
;
;   1) a host DTR/RTS billentese HARDVERESEN RESETELI a chipet — a bootlogban
;      "rst:0x15 (USB_UART_CHIP_RESET)". A reset utan a USB UJRA-ENUMERAL, es a
;      Windows usbser.sys mar nyitott handle-je ZOMBI lesz: a PC-n a read()
;      onnantol orokre 0 bajtot ad. Merve: 60 s alatt 1-9 blokk erkezett.
;   2) a HWCDC abbol donti el, hogy "van-e host", hogy urul-e a TX FIFO. Ha
;      egyszer megtelt (mert a host nem olvasott), onnantol "nincs host",
;      minden irast eldob -> a FIFO sose urul. Onmagat erosito beragadas.
;      A statuszsorban:  USB 0.0 kB/s(-244)   <- a (-244) az eldobasszam.
;
; A TinyUSB-s USBCDC-nek (MODE=0) VAN enableReboot(false) metodusa: a DTR/RTS
; onnantol nem resetel. A main.cpp ezt "#if defined(ARDUINO_USB_MODE) &&
; (ARDUINO_USB_MODE == 0)" agban hivja, tehat MINDKET modban lefordul.
;
; A regi, bevalt HWCDC-s valtozat NEM VESZETT EL: [env:esp32s3_hwcdc] neven
; egy kattintasra elerheto. Ha barmi gond van a TinyUSB-vel, oda visszalepsz.
;
; FIGYELEM A COM-SZAMRA: MODE=0-ban mas az USB PID, tehat a nativ USB uj
; COM-szamot kap (a CP2102 marad a regi!). A VID marad 0x303A, ezert az
; usb_aprs_rx.py auto-detektalasa tovabbra is megtalalja.
;
; ================== HASZNALAT VSCODE-BAN ==================
;
; Alul a statuszsavban az environment nevere kattintva valthatsz, vagy a
; PlatformIO oldalsavban a "Project Tasks" alatt mindegyik kap sajat
; Build / Upload / Monitor gombot.
;
;   esp32s3         -> a fo firmware, TinyUSB (ez a default)
;   esp32s3_hwcdc   -> ugyanaz HWCDC-vel (a 2026-08-06 elotti viselkedes)
;   esp32s3_nowifi  -> a fo firmware WiFi es SpyServer NELKUL — izolalo meres
;   bench_hwcdc     -> USB-plafon meres, beepitett USB-Serial/JTAG-gel
;   bench_tiny      -> USB-plafon meres, TinyUSB OTG-vel
;   probe_cs        -> CS-lab proba: eljut-e a keretjel a FG23-tol az ESP-ig
;
; A ket bench kozott CSAK az ARDUINO_USB_MODE kulonbozik. Futtasd le
; mindkettot es hasonlitsd ossze — ugyanazon a ket labon (GPIO19/20) gyakran
; ketszeres a kulonbseg.
;
; ================== A MONITOR PORT ==================
;
; Ket soros porton latszik az eszkoz: a CP2102-n jon a szoveges diagnosztika
; (Serial0), a forrasztott nativ USB-n a nyers I/Q folyam (Serial). A
; monitor_port-ba a CP2102 valo. Ha ures marad, a PlatformIO tippel, es amint
; mindketto lathato, jo esellyel a rosszat valasztja — binaris szemetet fogsz
; nezni, es ket percig azt hiszed, elromlott valami.

[platformio]
default_envs = esp32s3

; ---------------- kozos alap ----------------
; Minden environment ebbol orokol. Igy a platform-verziot EGY helyen kell
; frissiteni, nem hatban.
[env]
; NE CSERELD "espressif32"-RE. Ez nem valami regi nyomozas maradeka: a
; regiszterbeli hivatalos platform-espressif32 evek ota all az Arduino 2.0.x
; magon, ez a pioarduino fork viszont a 3.x-et adja. A main.cpp-ben tobb minden
; ezen mulik — pl. a WiFiClient::availableForWrite(), ami a 2.0.x-ben nem volt
; implementalva (a gyurupufferben van ra vesztartalek, de vakon irna).
;
; A szamozas: IDF_fo IDF_al . Arduino. Tehat 51.03.05 = IDF 5.1 + Arduino 3.0.5,
; 55.03.39 = IDF 5.5.4 + Arduino 3.3.9.
;
; ================== 2026-08-01: FRISSITVE 55.03.39-RE ==================
;
; Ha ezt latod telepiteskor:
;     Error: Failed to install Python dependencies into penv
;     Error: Failed to install Python dependencies (exit code: 2)
;
; ...akkor NEM a platform rossz, hanem a VSCode-bovitmeny. A pioarduino 5x
; ujabb kiadasai sajat Python-kornyezetet epitenek (builder/penv_setup.py,
; uv-vel), amihez ujabb PlatformIO Core kell, mint amit a stock "PlatformIO
; IDE" bovitmeny szallit. A megoldas a PIOARDUINO SAJAT bovitmenye:
;
;   1. PlatformIO IDE bovitmeny eltavolitasa a VSCode-bol, majd VSCode ujra
;   2. a .platformio mappa torlese a felhasznaloi konyvtarbol
;      (Windows: C:\Users\<te>\.platformio)   <- a PROJEKT .pio mappaja mas!
;   3. "pioarduino IDE" bovitmeny telepitese a VSCode marketplace-rol
;   4. git legyen a PATH-on ("git --version" fusson parancssorbol),
;      Python 3.10 vagy ujabb
;   5. VSCode ujraindit, projekt megnyit, Build
;
; A .platformio torlese miatt MINDEN platform es toolchain ujra letoltodik,
; tehat az elso build hosszu lesz. Ez egyszeri ar.
;
; Visszaut, ha kell: cserelj vissza 51.03.05-re, es a main.cpp-ben az
; accept() -> available() ket helyen.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
; ================== 2026-08-19: S3-N16R8 (16 MB flash + 8 MB OKTALIS PSRAM) ==
; A board-manifest N8 / "No PSRAM" alapertelmezest ad — a mi panelunk NEM az.
; A memory_type = qio_opi jelenti: flash QIO, PSRAM OKTALIS (OPI).
;
; MIERT KELL: 2026-08-18-i meres — a szabad heap INDULASKOR 42 kB volt a
; 320-bol, es terheles alatt NULLARA fogyott (RAM: min 0 k). Nem a WiFi es
; nem a radio volt a korlat, hanem az allokacio. A nagy pufferek PSRAM-ba
; koltoztetesevel a belso RAM felszabadul a lwIP-nek.
;
; A 33..37 GPIO EZZEL ELVESZIK (az oktalis PSRAM hasznalja). Nalunk ez
; rendben van: az egyetlen erintett a regi OLED_VEXT_PIN 36 volt, es az
; OLED 2026-08-19-en kivezetve.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
framework = arduino
monitor_speed = 115200
; Feltöltési sebesség emelése (alapértelmezett: 115200)
upload_speed = 921600
monitor_filters = send_on_enter
monitor_echo = yes

; A CP2102 portja — nezd meg az Eszkozkezeloben es ird ide.
; A te gepeden (2026-08-06):  COM3 = J-Link,  COM10 = CP2102 (diagnosztika),
; COM4 = a nativ USB adatvonal (MODE=0-ra valtas utan ez valtozhat!).
; monitor_port = COM10
; upload_port  = COM10

; ---------------- a fo firmware KOZOS resze ----------------
; EZ NEM ENVIRONMENT, hanem sablon: a "[env:...]" bejegyzesek az
; "extends = fw_base" sorral orokolnek belole. Amit ide irsz, az MIND A HAROM
; firmware-valtozatra hat — nem kell harom helyen karbantartani.
[fw_base]
build_src_filter = +<*> -<.git/>
; A flash-logger (LittleFS) egy adat-particiot igenyel. Az alap sema tartalmaz
; ilyet, ezert ez alapbol KIKOMMENTELVE marad. HA boot-kor "flashlog: LittleFS
; mount HIBA" jon (vagy az app nem fer be), vedd ki az alabbi sor elejerol a ';'-t
; (8 MB-os S3 kell hozza — a Heltec V3 az):
; board_build.partitions = partitions_8mb_fs.csv
;
; Az OLED-hez. CSAK a firmware-environmentek kapjak: a bench es a proba nem
; hasznalja, azoknak ne kelljen leforditani.
lib_deps =
  olikraus/U8g2
  lovyan03/LovyanGFX @ ^1.1.16
;
; ---- ESP-IDF szintu kapcsolok, ha kellenek ----
; Mindketto KIKOMMENTELVE indul. Csak akkor vedd ki a ';'-t, ha a lentebb
; leirt konkret tunetet latod — vakon ne kapcsolgasd.
;
;   CONFIG_SPI_SLAVE_ISR_IN_IRAM=y
;     A bootlogban ez all:  "spi_slave_initialize (IRAM + LEVEL3): 258"
;     majd  "(LEVEL3): 0  <-- EZ MEGY".  A 258 = ESP_ERR_INVALID_ARG: az
;     ESP_INTR_FLAG_IRAM-ot a driver visszautasitja, amig ez a sdkconfig
;     kapcsolo nincs bekapcsolva. Bekapcsolva az SPI-slave megszakitasa az
;     IRAM-bol fut, tehat a flash-muveletek (LittleFS-iras, WiFi-kalibracio)
;     sem tudjak felfuggeszteni. A main.cpp mar most is MEGPROBALJA az IRAM-os
;     valtozatot es visszaesik LEVEL3-ra — tehat a kapcsolo bekapcsolasa utan
;     magatol az IRAM-os agra megy, kodmodositas nelkul.
;
;   CONFIG_TINYUSB_CDC_TX_BUFSIZE=4096
;     CSAK MODE=0 (TinyUSB) mellett szamit. Ha a statuszsorban eldobast latsz
;     (pl. "USB 0.0 kB/s(-244)" vagy barmi, ami nem "(-0)"), akkor a CDC TX
;     FIFO kicsi. A main.cpp flush_usb()-ja mar BLOKKONKENT ir (1040 bajt),
;     nem az egesz 4160-as gyujtot egyben, tehat kisebb FIFO-val is mukodik —
;     de ha megis dobal, ez a sor a gyogyszer.
;
;   CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
;     NEM a mi funkcionk — kenyszer. A custom_sdkconfig bekapcsolasa a TELJES
;     IDF-et ujraforditja, tehat olyan komponensek is, amiket sosem hasznalunk
;     (BLE mesh, RainMaker, esp-sr, modbus). Az esp-modbus-ban van egy
;     _Static_assert:  MAX_API_BLOCKING_TIME_MS >= TIMEOUT_MS_RESPOND.
;     Az Arduino-libek sdkconfigjaban 6000 < 10000, tehat elhasal. A friss
;     managed_components verzio hozta be ezt az assertet. 10000-re emelve
;     teljesul; minket nem erint, mert modbust nem hasznalunk.  (2026-08-07)
;
;   FIGYELEM, TEVES DIAGNOZIS VOLT (2026-08-07): egy ideig azt hittuk, hogy a
;   "Detected a whitespace character in project paths" hibat a tobbsoros
;   custom_sdkconfig behuzasa okozza. NEM. A PROJEKTMAPPA NEVEBEN volt szokoz
;   ("FG23-SDR-ESP32-S3 streaming"), amit az IDF CMake/ninja nem tur. Ezert
;   lett a mappa "FG23-SDR-ESP32-S3-streaming". A behuzott tobbsoros alak
;   rendben van, az a pioarduino dokumentalt formaja.
;   ================== KIKAPCSOLVA 2026-08-07 ==================
;   NE VEDD KI A ';'-t, amig a lib-builder-es ut nincs kesz. Miert:
;
;   A custom_sdkconfig a TELJES IDF-et ujraforditja forrasbol. Az
;   arduino_tinyusb komponens viszont a pioarduino-ban CSAK ELOREFORDITVA
;   letezik:
;       framework-arduinoespressif32-libs\esp32s3\lib\libarduino_tinyusb.a
;       framework-arduinoespressif32-libs\esp32s3\include\arduino_tinyusb\
;   — a framework FORRAS-csomagjaban (framework-arduinoespressif32) nincs
;   components\ mappa egyaltalan. Nincs tehat Kconfig, ezert forrasbol
;   forditaskor a CONFIG_TINYUSB_* szimbolumok LETRE SEM JONNEK, a kconfgen
;   kidobja oket a sdkconfig.defaults-bol, es a fordito ezt mondja:
;       HardwareSerial.h:445: error: 'USBSerial' was not declared in this scope
;   mert ARDUINO_USB_MODE=0 mellett a Serial makro USBSerial-re megy, azt
;   pedig az USBCDC.h csak CONFIG_TINYUSB_CDC_ENABLED mellett deklaralja.
;
;   Vagyis ezen a platformverzion a custom_sdkconfig es a NATIV USB CDC
;   KIZARJA EGYMAST. Nekunk viszont mindketto kell: az IRAM-os SPI-ISR es
;   a natív USB adatvonal (az kell a usb_aprs_rx.py-hoz, WiFi-tol
;   fuggetlenul).
;
;   A HELYES UT (kesobbre): esp32-arduino-lib-builder. Azzal generalunk egy
;   SAJAT framework-arduinoespressif32-libs csomagot a mi sdkconfigunkkal
;   (benne CONFIG_SPI_SLAVE_ISR_IN_IRAM=y), es abban az arduino_tinyusb is
;   bent van, mert a lib-buildernek megvan hozza a forrasa. Utana ez a sor
;   VEGLEG kikerul, es a build ugyanolyan gyors marad, mint eddig.
;
;   Addig a 2026-08-07-i meresbol vezetett ket valtozas ved (main.cpp):
;   NQUEUE 16 -> 24 (82 ms -> 123 ms athidalas) es a flashlog flush-ablak.
;
;   =============== BEKAPCSOLVA 2026-08-07 este ===============
;   FIGYELEM: EZZEL CSAK AZ [env:esp32s3_hwcdc] FORDUL LE!
;
;   Az esp32s3 (MODE=0, natív USB) NEM fog leforduni, mert forrasbol
;   forditva nincs arduino_tinyusb -> 'USBSerial' was not declared.
;   Ez nem hiba a mi oldalunkon, hanem a platform korlatja (lasd fent).
;   A hwcdc environmentben viszont a Serial a HWCDC-re megy, amit a
;   HardwareSerial.h maga behuz, tehat atmegy.
;
;   Ha vissza akarod kapni a natív USB adatvonalat: kommenteld ki ujra
;   ezt a harom sort, es epitsd az esp32s3-at.
custom_sdkconfig =
  CONFIG_SPI_SLAVE_ISR_IN_IRAM=y
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
;  --------- 2026-08-19: OKTALIS PSRAM (S3-N16R8) ---------
;  A SPIRAM_USE_MALLOC + ALWAYSINTERNAL=16384 azt jelenti, hogy a
;  16 kB-nal NAGYOBB malloc-ok MAGUKTOL a PSRAM-ba kerulnek. A
;  spyserver 64 kB-os gyuruje (malloc a spyserver.cpp-ben) tehat
;  KODMODOSITAS NELKUL atkoltozik — 64 kB belso RAM szabadul fel.
;  A statikus tombok (rxbuf, rxring, ro_buf, ring_raw_buf) BSS-ben
;  vannak, azok maradnak belul — es a rxbuf/rxring MARADJON is,
;  mert azok az SPI-slave DMA es az ISR utjaban allnak.
;  A TRY_ALLOCATE_WIFI_LWIP a WiFi/lwIP puffereit is PSRAM-bol adja,
;  ahol lehet — pontosan ez volt a 2026-08-18-i osszeomlas oka.
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_SPIRAM_USE_MALLOC=y
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
;  CONFIG_TINYUSB_CDC_TX_BUFSIZE=4096

; ---------------- a fo firmware: TinyUSB (DEFAULT) ----------------
; MODE=0  -> USBCDC (TinyUSB OTG). Van enableReboot(false)-a, tehat a PC-oldali
;            portnyitas NEM resetel. Ez kell a usb_aprs_rx.py-hoz.
; CDC=1   -> Serial   = nativ USB CDC  (nyers I/Q folyam)
;            Serial0  = UART0 / CP2102 (szoveges diagnosztika)
; A ketto egyutt kell. CDC=0 mellett a Serial a UART0 lenne, es a firmware
; le sem fordul (a HardwareSerial-nek nincs setTxTimeoutMs-e).
;
; MIERT board_build.extra_flags ES NEM build_flags? (2026-08-07)
; A board-manifest (esp32-s3-devkitc-1.json) igy szol:
;     "extra_flags": ["-DARDUINO_ESP32S3_DEV", "-DARDUINO_USB_MODE=1",
;                     "-DARDUINO_RUNNING_CORE=1", "-DARDUINO_EVENT_RUNNING_CORE=1"]
; Ha ezt build_flags-bol irjuk felul 0-ra, akkor KET definicio all a
; parancssoron, es a forditó minden egyes forditasi egysegre kiirja:
;     <command-line>: warning: "ARDUINO_USB_MODE" redefined
; A build_unflags erre nem hat, mert a board extra_flags mas uton kerul be.
; Amig eloreforditott Arduino-libeket hasznaltunk, ez csak zaj volt: mindossze
; a sajat src/-nk fordult. A custom_sdkconfig viszont az EGESZ IDF-et
; ujraforditja a mi flagjeinkkel, es van olyan komponens (esp-modbus), ami
; -Werror-ral fordul -> a figyelmeztetesbol HIBA lesz, es all a build.
; A board_build.extra_flags a manifest erteket a FORRASANAL csereli, tehat
; egyetlen definicio marad, redefinition nincs, -Werror nem tud belekotni.
; A listat teljesen ujra kell adni, mert felulirja az egeszet — ha
; platformot frissitunk, ellenorizd, valtozott-e a gyari lista.
[env:esp32s3]
extends = fw_base
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- a fo firmware: HWCDC (a regi viselkedes) ----------------
; A 2026-08-06 elotti beallitas, valtozatlanul. Akkor hasznald, ha a TinyUSB-vel
; barmi gond van, vagy ha a ketto viselkedeset akarod osszehasonlitani.
; FIGYELEM: ezzel a PC-oldali usb_aprs_rx.py NEM fog stabilan adatot kapni
; (lasd a fenti "2026-08-06" szakaszt) — ez normalis, nem hiba.
[env:esp32s3_hwcdc]
extends = fw_base
build_unflags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- IZOLALO MERES: WiFi es SpyServer NELKUL ----------------
; EZ AZ ENVIRONMENT DONTI EL A "KOBE VESETT" KERDEST.
;
; A kerdes az volt, hogy a maradek blokkveszteseget a WiFi/SpyServer-forgalom
; okozza-e. Statisztikabol ezt csak valoszinusiteni lehet; igy viszont a WiFi
; BELE SEM KERUL A BINARISBA, tehat a hatasa definicio szerint nulla. Ha ezzel
; a builddel a veszteseg eltunik, a bizonyitas kesz. Ha megmarad, akkor a WiFi
; artatlan volt, es mashol kell keresni.
;
; A WIFI_ENABLE / SPY_ENABLE a main.cpp-ben "#ifndef"-be van csomagolva, ezert
; INNEN felulirhato — nem kell a forrast atirni, majd visszairni. (Pont az a
; kezi visszairas szokott elmaradni, es utana hetekig keresel egy nem letezo
; hibat egy olyan binarisban, amiben veletlenul bent maradt egy 0.)
;
; Amit meg erdemes kiprobalni ugyanigy, ha a WiFi artatlannak bizonyul:
;   -DOLED_ENABLE=0     az OLED I2C-frissitese ~20 ms-ot esz ciklusonkent
;                       (a diag "oled=20240" mezoje mikroszekundumban!)
;   -DAPRS_RX_ENABLE=0  a fedelzeti demod CPU-igenye
; (A board_build.extra_flags indoklasa az [env:esp32s3]-nal.)
[env:esp32s3_nowifi]
extends = fw_base
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWIFI_ENABLE=0
  -DSPY_ENABLE=0

; ---------------- USB-plafon meres: HWCDC ----------------
; A beepitett USB-Serial/JTAG kontroller. Ez a referencia-meres.
[env:bench_hwcdc]
build_src_filter = -<*> +<../bench/usb_bench.cpp>
build_unflags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- USB-plafon meres: TinyUSB ----------------
; Az OTG periferia, ugyanazon a ket labon (GPIO19/20). Tobb RAM-ot esz,
; cserebe jellemzoen nagyobb atbocsatokepesseget ad.
[env:bench_tiny]
build_src_filter = -<*> +<../bench/usb_bench.cpp>
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- CS-lab proba ----------------
; Kihagyja az egesz SPI periferiat: csak megszamolja a CS lefuto eleit egy
; sima GPIO-megszakitassal. EZ fogta meg, hogy a keretjel egyaltalan nem ert
; el az ESP-ig (elcsuszott EXP-terkep). Tartsd meg: amikor legkozelebb "nincs
; adat", ez a masodik lepes a multimeter utan.
;
; CDC_ON_BOOT=0: itt a Serial LEGYEN a UART0 / CP2102, mert a proba mindent
; oda ir, es a nativ USB-re nincs szukseg.
[env:probe_cs]
build_src_filter = -<*> +<../bench/cs_probe.cpp>
build_unflags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0