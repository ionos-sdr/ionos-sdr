; SPDX-License-Identifier: MIT
;
; FG23 SDR — ESP32-S3 side
;   Copyright (c) 2026 Zoltan Doczi HA7DCD
;
; ================== WHY ONE PROJECT, SEVERAL ENVIRONMENTS ==================
;
; The benchmark needs DIFFERENT build_flags (ARDUINO_USB_MODE 1 <-> 0) and a
; different entry point. That does not require a separate project: PlatformIO
; is made for exactly this. One repo, one platformio.ini, several drop-down
; entries in the VSCode status bar.
;
; The problem with a separate project would be that the block format (1040
; bytes, "IQB2", the header fields) would live in TWO places. Truth living in
; two places sooner or later becomes two DIFFERENT truths — exactly this
; caused the overnight hunt where an outdated sketch header's EXP map was
; shifted by one position.
;
; THE SAME PRINCIPLE NOW APPLIES TO THE FIRMWARE ENVIRONMENTS: three variants
; are needed (TinyUSB / HWCDC / WiFi-free), but the build_src_filter, the
; lib_deps and the partition scheme are the same in ALL THREE. Writing them
; out three times would be truth living in three places. Hence the [fw_base]
; template and "extends": the common part is in ONE place, and the
; environments state ONLY the difference.
;
; ================== DIRECTORY LAYOUT ==================
;
;   fg23-sdr/
;     platformio.ini        <- this file
;     src/
;       main.cpp            <- the main firmware (SPI slave -> USB + WiFi + rtl_tcp)
;     bench/
;       usb_bench.cpp       <- the USB ceiling meter (renamed from .ino to .cpp)
;       cs_probe.cpp        <- CS pin probe
;
; The PC-side measurement scripts are NOT here but in a separate measurement
; directory:
;     usb_aprs_rx.py        <- native USB -> PC-side APRS decoder + SPI gaps
;     rtl_aprs_rx.py        <- independent RTL-SDR witness (same demod core)
;     aprs_per.py           <- PER/sensitivity measurement from the ESP serial output
;
; bench/ is NOT under src/ because PlatformIO would by default compile
; EVERYTHING under src/, and two setup()/loop() pairs would collide.
;
; The Simplicity Studio project (app.c, iq_stream.c, cmdlink.c) lives
; separately — it is a different toolchain and has no place here.
;
; ================== ABOUT THE USB FLAGS — THIS IS THE POINT ==================
;
; EVERY environment sets ARDUINO_USB_MODE and ARDUINO_USB_CDC_ON_BOOT
; EXPLICITLY. Nothing is left to the board definition.
;
; WHY: on 2026-08-01 they were omitted from the main environment, expecting
; the esp32-s3-devkitc-1 board to provide them. With pioarduino 55.x it does
; NOT — so Serial became UART0 instead of the native USB CDC, and the build
; failed:
;     error: 'class HardwareSerial' has no member named 'setTxTimeoutMs'
;     error: no matching function for call to 'HardwareSerial::begin()'
;
; The error message is misleading: setTxTimeoutMs is not missing, the TYPE of
; Serial changed. With CDC_ON_BOOT=1, Serial = HWCDC (or USBCDC), and that has
; setTxTimeoutMs. So do not build assumptions on what the board provides —
; write it out.
;
; ABOUT build_unflags, AND A TRAP: PlatformIO processes build_unflags AFTER
; build_flags, on the FINAL flag set. So unflagging and flagging the same
; macro would delete our own flag. Exactly this happened on 2026-08-01: the
; common block contained "-DARDUINO_USB_CDC_ON_BOOT=1" as an unflag, and it
; killed the identical flag set in the environment — 0 remained, and the same
; build error came back a second time.
;
; THEREFORE: every environment unflags ONLY THE OPPOSITE value. Never the one
; it wants to set. If the board provides the same value, that is an identical
; redefinition — C allows it, without even a warning.
;
; ================== 2026-08-06: THE MAIN FIRMWARE SWITCHED TO MODE=0 ==================
;
; The main firmware used to be MODE=1 (HWCDC = the built-in USB-Serial/JTAG).
; That is unusable for RADIATED measurements, due to two interacting
; properties:
;
;   1) toggling DTR/RTS by the host RESETS the chip IN HARDWARE — in the boot
;      log: "rst:0x15 (USB_UART_CHIP_RESET)". After the reset the USB
;      RE-ENUMERATES, and the already open Windows usbser.sys handle becomes a
;      ZOMBIE: from then on read() returns 0 bytes forever on the PC. Measured:
;      1-9 blocks arrived in 60 s.
;   2) HWCDC decides whether "a host is present" from whether the TX FIFO
;      drains. Once it is full (because the host did not read), it is "no
;      host" from then on, every write is dropped -> the FIFO never drains. A
;      self-reinforcing lock-up. In the status line:  USB 0.0 kB/s(-244)
;      <- the (-244) is the drop count.
;
; The TinyUSB USBCDC (MODE=0) HAS an enableReboot(false) method: DTR/RTS no
; longer resets. main.cpp calls it in an "#if defined(ARDUINO_USB_MODE) &&
; (ARDUINO_USB_MODE == 0)" branch, so it compiles in BOTH modes.
;
; The old, proven HWCDC variant is NOT LOST: it is available with one click as
; [env:esp32s3_hwcdc]. If anything is wrong with TinyUSB, fall back there.
;
; MIND THE COM NUMBER: in MODE=0 the USB PID differs, so the native USB gets a
; new COM number (the CP2102 keeps the old one!). The VID stays 0x303A, so the
; auto-detection of usb_aprs_rx.py still finds it.
;
; ================== USAGE IN VSCODE ==================
;
; Click the environment name in the status bar at the bottom to switch, or
; each one gets its own Build / Upload / Monitor buttons under "Project Tasks"
; in the PlatformIO sidebar.
;
;   esp32s3         -> the main firmware, TinyUSB (the default)
;   esp32s3_hwcdc   -> the same with HWCDC (the behaviour before 2026-08-06)
;   esp32s3_nowifi  -> the main firmware WITHOUT WiFi and SpyServer — isolation measurement
;   bench_hwcdc     -> USB ceiling measurement, built-in USB-Serial/JTAG
;   bench_tiny      -> USB ceiling measurement, TinyUSB OTG
;   probe_cs        -> CS pin probe: does the frame signal reach the ESP from the FG23
;
; The two benches differ ONLY in ARDUINO_USB_MODE. Run both and compare — on
; the same two pins (GPIO19/20) the difference is often a factor of two.
;
; ================== THE MONITOR PORT ==================
;
; The device shows up on two serial ports: text diagnostics (Serial0) come on
; the CP2102, the raw I/Q stream (Serial) on the soldered native USB. The
; CP2102 belongs in monitor_port. If left empty, PlatformIO guesses, and as
; soon as both are visible it will most likely pick the wrong one — binary
; garbage appears and it takes two minutes to realise nothing is broken.

[platformio]
default_envs = esp32s3

; ---------------- common base ----------------
; Every environment inherits from this. Thus the platform version is updated
; in ONE place, not in six.
[env]
; DO NOT REPLACE WITH "espressif32". This is not a leftover of some old
; investigation: the official platform-espressif32 in the registry has been
; stuck on the Arduino 2.0.x core for years, while this pioarduino fork
; provides 3.x. Several things in main.cpp depend on it — e.g.
; WiFiClient::availableForWrite(), which was not implemented in 2.0.x (the
; ring buffer has a loss reserve for it, but it would write blindly).
;
; Numbering: IDF_major IDF_minor . Arduino. So 51.03.05 = IDF 5.1 + Arduino
; 3.0.5, 55.03.39 = IDF 5.5.4 + Arduino 3.3.9.
;
; ================== 2026-08-01: UPDATED TO 55.03.39 ==================
;
; If this appears during installation:
;     Error: Failed to install Python dependencies into penv
;     Error: Failed to install Python dependencies (exit code: 2)
;
; ...then it is NOT the platform that is broken, but the VSCode extension.
; Newer pioarduino 5x releases build their own Python environment
; (builder/penv_setup.py, with uv), which needs a newer PlatformIO Core than
; the stock "PlatformIO IDE" extension ships. The solution is PIOARDUINO'S
; OWN extension:
;
;   1. remove the PlatformIO IDE extension from VSCode, then restart VSCode
;   2. delete the .platformio folder from the user directory
;      (Windows: C:\Users\<you>\.platformio)   <- the PROJECT .pio folder is different!
;   3. install the "pioarduino IDE" extension from the VSCode marketplace
;   4. git must be on the PATH ("git --version" must run from a shell),
;      Python 3.10 or newer
;   5. restart VSCode, open the project, Build
;
; Because .platformio is deleted, EVERY platform and toolchain is downloaded
; again, so the first build is long. This is a one-time cost.
;
; Way back, if needed: revert to 51.03.05, and in main.cpp change
; accept() -> available() in two places.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
; ================== 2026-08-19: S3-N16R8 (16 MB flash + 8 MB OCTAL PSRAM) ==
; The board manifest defaults to N8 / "No PSRAM" — our board is NOT that.
; memory_type = qio_opi means: flash QIO, PSRAM OCTAL (OPI).
;
; WHY IT IS NEEDED: measurement of 2026-08-18 — the free heap AT START-UP was
; 42 kB of 320, and under load it dropped to ZERO (RAM: min 0 k). Neither
; WiFi nor the radio was the limit, but allocation. Moving the large buffers
; to PSRAM frees the internal RAM for lwIP.
;
; GPIO 33..37 ARE LOST with this (the octal PSRAM uses them). That is fine
; here: the only affected one was the old OLED_VEXT_PIN 36, and the OLED was
; retired on 2026-08-19.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
framework = arduino
monitor_speed = 115200
; Raised upload speed (default: 115200)
upload_speed = 921600
monitor_filters = send_on_enter
monitor_echo = yes

; The CP2102 port — check it in the Device Manager and enter it here.
; Example (2026-08-06):  COM3 = J-Link,  COM10 = CP2102 (diagnostics),
; COM4 = the native USB data line (this may change after switching to MODE=0!).
; monitor_port = COM10
; upload_port  = COM10

; ---------------- COMMON part of the main firmware ----------------
; THIS IS NOT AN ENVIRONMENT but a template: the "[env:...]" entries inherit
; from it via the "extends = fw_base" line. Whatever is written here applies
; to ALL THREE firmware variants — no need to maintain it in three places.
[fw_base]
build_src_filter = +<*> -<.git/>
; The flash logger (LittleFS) needs a data partition. The default scheme
; contains one, so this stays COMMENTED OUT by default. IF "flashlog: LittleFS
; mount ERROR" appears at boot (or the app does not fit), remove the ';' from
; the start of the line below (requires an 8 MB S3 — the Heltec V3 is one):
; board_build.partitions = partitions_8mb_fs.csv
;
; For the OLED. ONLY the firmware environments get it: the bench and the probe
; do not use it, so they need not compile it.
lib_deps =
  olikraus/U8g2
  lovyan03/LovyanGFX @ ^1.1.16
;
; ---- ESP-IDF level switches, if needed ----
; Both start COMMENTED OUT. Remove the ';' only if you see the specific
; symptom described below — do not toggle blindly.
;
;   CONFIG_SPI_SLAVE_ISR_IN_IRAM=y
;     The boot log says:  "spi_slave_initialize (IRAM + LEVEL3): 258"
;     then  "(LEVEL3): 0  <-- THIS WORKS".  258 = ESP_ERR_INVALID_ARG: the
;     driver rejects ESP_INTR_FLAG_IRAM until this sdkconfig switch is
;     enabled. Enabled, the SPI slave interrupt runs from IRAM, so flash
;     operations (LittleFS write, WiFi calibration) cannot suspend it either.
;     main.cpp already TRIES the IRAM variant and falls back to LEVEL3 — so
;     after enabling the switch it takes the IRAM branch by itself, without
;     code changes.
;
;   CONFIG_TINYUSB_CDC_TX_BUFSIZE=4096
;     Matters ONLY with MODE=0 (TinyUSB). If the status line shows drops
;     (e.g. "USB 0.0 kB/s(-244)" or anything other than "(-0)"), the CDC TX
;     FIFO is small. The flush_usb() in main.cpp already writes PER BLOCK
;     (1040 bytes), not the whole 4160-byte accumulator at once, so it works
;     with a smaller FIFO too — but if it still drops, this line is the cure.
;
;   CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
;     NOT our feature — a necessity. Enabling custom_sdkconfig rebuilds the
;     WHOLE IDF, including components we never use (BLE mesh, RainMaker,
;     esp-sr, modbus). esp-modbus contains a
;     _Static_assert:  MAX_API_BLOCKING_TIME_MS >= TIMEOUT_MS_RESPOND.
;     In the sdkconfig of the Arduino libs 6000 < 10000, so it fails. The
;     recent managed_components version introduced this assert. Raised to
;     10000 it holds; it does not affect us, as modbus is not used. (2026-08-07)
;
;   NOTE, A WRONG DIAGNOSIS (2026-08-07): for a while the "Detected a
;   whitespace character in project paths" error was blamed on the indented
;   multi-line custom_sdkconfig. NO. There was a space in the PROJECT FOLDER
;   NAME ("FG23-SDR-ESP32-S3 streaming"), which the IDF CMake/ninja does not
;   tolerate. Hence the folder became "FG23-SDR-ESP32-S3-streaming". The
;   indented multi-line form is fine; it is the documented pioarduino format.
;   ================== DISABLED 2026-08-07 ==================
;   DO NOT REMOVE THE ';' until the lib-builder path is ready. Why:
;
;   custom_sdkconfig rebuilds the WHOLE IDF from source. But in pioarduino the
;   arduino_tinyusb component exists ONLY PRECOMPILED:
;       framework-arduinoespressif32-libs\esp32s3\lib\libarduino_tinyusb.a
;       framework-arduinoespressif32-libs\esp32s3\include\arduino_tinyusb\
;   — the framework SOURCE package (framework-arduinoespressif32) has no
;   components\ folder at all. So there is no Kconfig, and when building from
;   source the CONFIG_TINYUSB_* symbols are NEVER CREATED; kconfgen drops them
;   from sdkconfig.defaults, and the compiler says:
;       HardwareSerial.h:445: error: 'USBSerial' was not declared in this scope
;   because with ARDUINO_USB_MODE=0 the Serial macro maps to USBSerial, which
;   USBCDC.h declares only with CONFIG_TINYUSB_CDC_ENABLED.
;
;   I.e. on this platform version custom_sdkconfig and the NATIVE USB CDC are
;   MUTUALLY EXCLUSIVE. But we need both: the IRAM SPI ISR and the native USB
;   data line (needed by usb_aprs_rx.py, independently of WiFi).
;
;   THE PROPER PATH (later): esp32-arduino-lib-builder. It generates a CUSTOM
;   framework-arduinoespressif32-libs package with our sdkconfig (including
;   CONFIG_SPI_SLAVE_ISR_IN_IRAM=y), and arduino_tinyusb is included, because
;   the lib-builder has its source. After that this line is removed FOR GOOD,
;   and the build stays as fast as before.
;
;   Until then, two changes derived from the 2026-08-07 measurement protect us
;   (main.cpp): NQUEUE 16 -> 24 (82 ms -> 123 ms bridging) and the flashlog
;   flush window.
;
;   =============== ENABLED evening of 2026-08-07 ===============
;   CAUTION: WITH THIS ONLY [env:esp32s3_hwcdc] BUILDS!
;
;   esp32s3 (MODE=0, native USB) will NOT build, because when built from
;   source there is no arduino_tinyusb -> 'USBSerial' was not declared.
;   This is not a fault on our side but a platform limitation (see above).
;   In the hwcdc environment, however, Serial maps to HWCDC, which
;   HardwareSerial.h itself pulls in, so it passes.
;
;   To get the native USB data line back: comment out these three lines
;   again and build esp32s3.
custom_sdkconfig =
  CONFIG_SPI_SLAVE_ISR_IN_IRAM=y
  CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
;  --------- 2026-08-19: OCTAL PSRAM (S3-N16R8) ---------
;  SPIRAM_USE_MALLOC + ALWAYSINTERNAL=16384 means that mallocs LARGER than
;  16 kB go to PSRAM AUTOMATICALLY. The 64 kB spyserver ring (malloc in
;  spyserver.cpp) therefore moves there WITHOUT CODE CHANGES — 64 kB of
;  internal RAM is freed.
;  The static arrays (rxbuf, rxring, ro_buf, ring_raw_buf) are in BSS and
;  stay internal — and rxbuf/rxring MUST stay there, because they are in
;  the path of the SPI slave DMA and the ISR.
;  TRY_ALLOCATE_WIFI_LWIP also serves the WiFi/lwIP buffers from PSRAM
;  where possible — exactly this was the cause of the 2026-08-18 crash.
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_MODE_OCT=y
  CONFIG_SPIRAM_SPEED_80M=y
  CONFIG_SPIRAM_USE_MALLOC=y
  CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
;  CONFIG_TINYUSB_CDC_TX_BUFSIZE=4096

; ---------------- the main firmware: TinyUSB (DEFAULT) ----------------
; MODE=0  -> USBCDC (TinyUSB OTG). Has enableReboot(false), so opening the
;            port on the PC side does NOT reset. Needed by usb_aprs_rx.py.
; CDC=1   -> Serial   = native USB CDC  (raw I/Q stream)
;            Serial0  = UART0 / CP2102 (text diagnostics)
; Both are required together. With CDC=0, Serial would be UART0 and the
; firmware would not even compile (HardwareSerial has no setTxTimeoutMs).
;
; WHY board_build.extra_flags AND NOT build_flags? (2026-08-07)
; The board manifest (esp32-s3-devkitc-1.json) says:
;     "extra_flags": ["-DARDUINO_ESP32S3_DEV", "-DARDUINO_USB_MODE=1",
;                     "-DARDUINO_RUNNING_CORE=1", "-DARDUINO_EVENT_RUNNING_CORE=1"]
; If this is overridden to 0 from build_flags, TWO definitions are on the
; command line, and the compiler prints for every translation unit:
;     <command-line>: warning: "ARDUINO_USB_MODE" redefined
; build_unflags has no effect on this, because the board extra_flags enter
; by a different route. While precompiled Arduino libs were used, this was
; only noise: only our own src/ compiled. custom_sdkconfig, however, rebuilds
; the WHOLE IDF with our flags, and some components (esp-modbus) build with
; -Werror -> the warning becomes an ERROR and the build stops.
; board_build.extra_flags replaces the manifest value AT ITS SOURCE, so a
; single definition remains, no redefinition, nothing for -Werror to catch.
; The list must be given in full, because it overrides the whole thing — when
; updating the platform, check whether the factory list changed.
[env:esp32s3]
extends = fw_base
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- the main firmware: HWCDC (the old behaviour) ----------------
; The setting from before 2026-08-06, unchanged. Use it if anything is wrong
; with TinyUSB, or to compare the behaviour of the two.
; CAUTION: with this the PC-side usb_aprs_rx.py will NOT receive data stably
; (see the "2026-08-06" section above) — this is normal, not a fault.
[env:esp32s3_hwcdc]
extends = fw_base
build_unflags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- ISOLATION MEASUREMENT: WITHOUT WiFi and SpyServer ----------------
; THIS ENVIRONMENT SETTLES THE "SET IN STONE" QUESTION.
;
; The question was whether the remaining block loss is caused by the
; WiFi/SpyServer traffic. Statistics can only make it likely; this way,
; however, WiFi IS NOT EVEN IN THE BINARY, so its effect is zero by
; definition. If the loss disappears with this build, the proof is complete.
; If it remains, WiFi was innocent and the cause is elsewhere.
;
; WIFI_ENABLE / SPY_ENABLE are wrapped in "#ifndef" in main.cpp, so they can
; be overridden FROM HERE — no need to edit the source and revert it. (It is
; exactly that manual revert that tends to be forgotten, followed by weeks of
; hunting a non-existent bug in a binary that accidentally kept a 0.)
;
; Also worth trying the same way, if WiFi proves innocent:
;   -DOLED_ENABLE=0     the OLED I2C refresh eats ~20 ms per loop iteration
;                       (the "oled=20240" field of the diag is in microseconds!)
;   -DAPRS_RX_ENABLE=0  the CPU demand of the on-board demod
; (The rationale for board_build.extra_flags is at [env:esp32s3].)
[env:esp32s3_nowifi]
extends = fw_base
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWIFI_ENABLE=0
  -DSPY_ENABLE=0

; ---------------- USB ceiling measurement: HWCDC ----------------
; The built-in USB-Serial/JTAG controller. This is the reference measurement.
[env:bench_hwcdc]
build_src_filter = -<*> +<../bench/usb_bench.cpp>
build_unflags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- USB ceiling measurement: TinyUSB ----------------
; The OTG peripheral, on the same two pins (GPIO19/20). Uses more RAM, but
; typically yields higher throughput.
[env:bench_tiny]
build_src_filter = -<*> +<../bench/usb_bench.cpp>
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------- CS pin probe ----------------
; Bypasses the whole SPI peripheral: only counts the CS falling edges with a
; plain GPIO interrupt. THIS caught that the frame signal did not reach the
; ESP at all (shifted EXP map). Keep it: the next time there is "no data",
; this is the second step after the multimeter.
;
; CDC_ON_BOOT=0: here Serial MUST be UART0 / CP2102, because the probe writes
; everything there, and the native USB is not needed.
[env:probe_cs]
build_src_filter = -<*> +<../bench/cs_probe.cpp>
build_unflags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0